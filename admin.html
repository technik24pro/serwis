<!DOCTYPE html><html lang='pl'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>Technik24 Admin</title><script src='https://cdn.tailwindcss.com'></script></head><body class='bg-black text-white min-h-screen flex items-center justify-center p-6'><div class='w-full max-w-md bg-zinc-900 border border-yellow-400 rounded-2xl p-8 shadow-2xl'><h1 class='text-4xl font-black text-center'>TECHNIK <span class='text-yellow-400'>24</span></h1><p class='text-center text-zinc-400 mt-2'>Panel Admina</p><input id='user' class='w-full mt-6 p-3 rounded-xl bg-black border border-zinc-700' placeholder='Login' onkeydown='if(event.key==="Enter") login()'><input id='pass' type='password' class='w-full mt-3 p-3 rounded-xl bg-black border border-zinc-700' placeholder='Hasło' onkeydown='if(event.key==="Enter") login()'><button onclick='login()' class='w-full mt-4 bg-yellow-400 text-black font-bold p-3 rounded-xl'>Zaloguj</button><p id='err' class='text-red-400 mt-3 text-center'></p></div><script>function login(){const u=user.value,p=pass.value;if(u==='admin'&&p==='technik24'){window.location.href='calendar.html';}else{err.innerText='Błędny login lub hasło';}}</script></body></html>
